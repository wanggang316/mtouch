name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Unit tests
        # Serial execution: a couple of hung-target tests exercise BoundedWalk's
        # abandon-on-timeout by leaving a briefly-blocked background thread; under
        # swift-testing's PARALLEL runner on the Xcode 16.x runtime that thread can
        # race a concurrent test's teardown and SIGBUS. Running serially keeps full
        # coverage without that cross-test interference. (The hung-target behavior
        # is also live-verified by VAL-SNAP-008 against a real SIGSTOPped app.)
        run: swift test --no-parallel

  ungranted-verification:
    name: Ungranted-persona live verification
    # Verifies the ungranted-persona fail-fast behavior (exit 2) that a granted
    # developer machine cannot reproduce: VAL-ENV-004/005/006, VAL-ACT-024,
    # VAL-WAIT-010, VAL-MCP-010. The GitHub runner turns out to REPORT
    # Accessibility as granted, so we best-effort reset TCC on this disposable
    # runner to produce an ungranted context; if that does not take, the probe
    # script SKIPs gracefully (green, but records it verified nothing).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Try to make the runner an ungranted host (disposable VM only)
        run: |
          sudo tccutil reset Accessibility >/dev/null 2>&1 || true
          tccutil reset Accessibility >/dev/null 2>&1 || true
          echo "post-reset doctor:"; .build/debug/mtouch doctor || true
      - name: Ungranted probes
        run: |
          chmod +x ci/ungranted-probes.sh
          MTOUCH_BIN=.build/debug/mtouch ci/ungranted-probes.sh
