name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test

  ungranted-verification:
    name: Ungranted-persona live verification
    # The runner has NOT been granted Accessibility, so the AX-gated commands
    # must fail fast with exit 2 — the ungranted-persona behavior a granted dev
    # machine cannot reproduce. Clears VAL-ENV-004/005/006, VAL-ACT-024,
    # VAL-WAIT-010, VAL-MCP-010 with real live evidence.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Ungranted probes
        run: |
          chmod +x ci/ungranted-probes.sh
          MTOUCH_BIN=.build/debug/mtouch ci/ungranted-probes.sh
